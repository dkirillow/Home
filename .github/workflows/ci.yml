# CI: на каждый PR и push в dev/main проверяем lint, типы и unit-тесты.
# Методичка, раздел 9: «CI (lint + typecheck + unit-тесты) должен быть зелёным».
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Новый push в тот же PR отменяет старый, ещё идущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI только читает код, писать в репозиторий ему нельзя.
permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Скачать код
        uses: actions/checkout@v7

      # Версию pnpm берёт из "packageManager" в корневом package.json.
      # Ставится до setup-node: иначе тому нечем включить кеш pnpm.
      - name: Установить pnpm
        uses: pnpm/action-setup@v6

      - name: Установить Node из .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: если pnpm-lock.yaml не совпадает с package.json — ошибка,
      # а не тихое обновление lock-файла. Здесь же postinstall генерирует Prisma Client
      # (БД для этого не нужна), а prepare собирает @home/shared.
      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Только unit. e2e нужен Postgres — их запускаем локально (pnpm --filter api test:e2e).
      - name: Unit-тесты
        run: pnpm test
